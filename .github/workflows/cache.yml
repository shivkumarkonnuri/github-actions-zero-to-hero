name: Cache Experiment

on:
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest

    steps:

      - name: Restore cache
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/demo-cache
          key: demo-cache

      - name: Show cache status
        run: echo "Cache hit? -> ${{ steps.cache-step.outputs.cache-hit }}"

      - name: Create directory
        run: |
          echo "Attempting to create directory"
          mkdir ~/demo-cache
          echo "file created" > ~/demo-cache/file.txt

      - name: Show directory contents
        run: ls -R ~/demo-cache
