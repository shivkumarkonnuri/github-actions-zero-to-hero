name: Docker Publish

on: 
  push:
    branches:
      - main
      - test-pr-trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Short commit hash
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Tag Docker Image
        run: |
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} ${{ vars.DOCKERHUB_USERNAME }}/myapp:sha-${{ env.SHORT_SHA }}

      - name: Docker Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/myapp:sha-${{ env.SHORT_SHA }}
