name: Matrix Strategy Practice

on:
  workflow_dispatch:

jobs:
  check_python:
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix:
      python-version: [3.10, 3.11, 3.12, 3.13]

    steps:

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check python version
        run: python --version
