name: Matrix Strategy Practice with OS and Python

on:
  workflow_dispatch:

jobs:
  check_python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest,windows-latest]

        exclude: 
          - python-version: "3.10"
            os: windows

    runs-on: ${{ matrix.os }}

    steps:

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check python version
        run: python --version
