name: Environment Variables Practice
on:
  workflow_dispatch

env:
  APP_NAME: myapp

jobs:

  env_var:
  env:
    ENVIRONMENT: staging
  runs-on: ubuntu-latest

  steps:
    - name: Print all environment variables
      env:
        VERSION: 1.0.0
      run: |
        echo "Workflow level variable: $APP_NAME"
        echo "Job Level variable: $ENVIRONMENT"
        echo "Step level variable: $VERSION"
        echo "Commit SHA: ${{ github.sha }}"
        echo "Actor: ${{ github.actor }}"
